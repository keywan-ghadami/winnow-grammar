[workspace]
members = ["winnow-grammar-macros", "winnow-grammar-model"]
resolver = "2"

[package]
name = "winnow-grammar"
version = "0.1.0"
edition = "2021"
description = "A parser generator for winnow: grammars as a DSL, compiled to winnow parsers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/keywan-ghadami/winnow-grammar"

[lib]
path = "src/winnow_grammar.rs"

[features]
trace = ["winnow/debug"]
# `parse_<rule>_pieces` on a `par_fold` rule runs the pieces on rayon's global
# pool. Without it the same function runs them in sequence.
rayon = ["dep:rayon"]

[dependencies]
# `simd` routes winnow's `find_slice` through `memchr` (SIMD where the target
# has it, the same word-at-a-time trick in portable code where it does not).
# Without it the scans behind `until(…)` and `recover(…)` fall back to a
# byte-at-a-time `position` and a naive substring search - see `rt::scan_to_*`.
winnow = { version = "0.7", features = ["simd"] }
winnow-grammar-macros = { path = "winnow-grammar-macros", version = "0.1.0" }
proc-macro2 = "1.0"
quote = "1.0"
lasso = { version = "0.7", features = ["multi-threaded"] }
# Emitted in the body of `test_case_impl!` (`src/testing.rs`), so it must be
# available to users of the macro as well - not only to our own tests.
paste = "1.0"
rayon = { version = "1.10", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
trybuild = "1.0.116"

[[bench]]
name = "interning"
harness = false

[[bench]]
name = "where"
harness = false

[[bench]]
name = "repetition"
harness = false
