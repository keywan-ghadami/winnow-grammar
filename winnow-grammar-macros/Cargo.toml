[package]
name = "winnow-grammar-macros"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
syn-grammar = { path = "../../syn-grammar" }
syn-grammar-model = { path = "../../core/syn-grammar-model" }
grammar-kit = { path = "../../core/grammar-kit" }
