# .aider.conf.yml

# The main model (architect)
model: gemini/gemini-3-pro-preview

# Set the mode to architect
#chat-mode: architect

yes-always: true

weak-model: gemini/gemini-3-flash-preview

# Optional: set the editor model (otherwise Aider picks a suitable default)
editor-model: gemini/gemini-3-pro-preview

# If you want git commits to be created automatically:
auto-commits: true

# Allows Aider to edit files without confirmation in architect mode
#auto-accept-architect: true

test-cmd: "cargo test"
auto-test: true
auto-lint: true
#lint-cmd: "rust: cargo clippy --fix --allow-dirty --allow-staged -- -D warnings && cargo fmt"

