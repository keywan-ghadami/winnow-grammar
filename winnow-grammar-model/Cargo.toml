[package]
name = "winnow-grammar-model"
version = "0.1.0"
edition = "2021"
description = "Parser, model and validator of the grammar DSL for winnow-grammar."
license = "MIT OR Apache-2.0"
repository = "https://github.com/keywan-ghadami/winnow-grammar"

[lib]
path = "src/winnow_grammar_model.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
