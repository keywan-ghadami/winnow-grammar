name: Rust CI

on:
  # Bewusst ohne Branch-Filter: auf Arbeitsbranches lief sonst gar keine CI.
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Gepinnt, nicht `stable`. `-D warnings` auf einer gleitenden Toolchain
      # heisst: die CI kann rot werden, ohne dass sich eine Zeile aendert -
      # sobald eine Rust-Veroeffentlichung einen Lint ergaenzt. Der Job
      # `lint-vorschau` unten laeuft weiter auf `stable` und meldet neue Lints,
      # ohne zu blockieren.
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Linting (Clippy)
        # `--workspace --all-targets` deckt auch die Makro-Crates, Tests und
        # Beispiele ab. Ohne das lief Clippy nur ueber lib und bins des
        # Wurzel-Crates - genau dort, wo die Warnungen NICHT waren.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run Tests
        # Runs doc tests and integration tests as well
        run: cargo test --workspace --verbose

      - name: Check Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  lint-vorschau:
    name: Lint-Vorschau (stable, nicht blockierend)
    runs-on: ubuntu-latest
    # Meldet Lints einer neueren Toolchain, bevor das Anheben der gepinnten
    # Version faellig wird. Ein Fehlschlag hier ist eine Vorwarnung, kein Stopp.
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-vorschau

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Linting (Clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items
