name: Rust CI

on:
  # Deliberately without a branch filter: otherwise no CI ran on working branches.
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Pinned, not `stable`. `-D warnings` on a moving toolchain means the CI
      # can turn red without a single line changing - as soon as a Rust
      # release adds a lint. The `lint-preview` job below keeps running on
      # `stable` and reports new lints without blocking.
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Linting (Clippy)
        # `--workspace --all-targets` also covers the macro crates, tests and
        # examples. Without it, Clippy only ran over lib and bins of the root
        # crate - exactly where the warnings were NOT.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run Tests
        # Runs doc tests and integration tests as well
        run: cargo test --workspace --verbose

      - name: Check Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  wasm:
    name: Build for wasm32
    runs-on: ubuntu-latest
    # The default `ahash` seeds from `getrandom`, which does not build for
    # `wasm32-unknown-unknown` without a backend the application chooses -
    # README, *Cargo features*. What a WebAssembly user is told to depend on
    # has to keep building: the build-time seed, and no `ahash` at all.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Build with the build-time seed
        run: cargo build --lib --target wasm32-unknown-unknown --no-default-features --features ahash-compile-time-rng

      - name: Build without ahash
        run: cargo build --lib --target wasm32-unknown-unknown --no-default-features

  lint-preview:
    name: Lint preview (stable, non-blocking)
    runs-on: ubuntu-latest
    # Reports lints of a newer toolchain before raising the pinned version
    # becomes due. A failure here is an early warning, not a stop.
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-preview

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Linting (Clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items
